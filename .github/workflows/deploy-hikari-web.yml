name: Deploy Hikari (Flutter Web)

on:
  push:
    branches:
      - main
      - arena/45285b5c-interfaceforge
    paths:
      - 'hikari/**'
      - '.github/workflows/deploy-hikari-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: hikari
        run: flutter pub get

      - name: Analyze
        working-directory: hikari
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        working-directory: hikari
        run: flutter test test/catalog_test.dart test/providers_test.dart test/assets_test.dart

      - name: Build web release
        working-directory: hikari
        run: flutter build web --release --base-href /InterfaceForge/

      # Артефакт доступен всегда, даже если деплой на Pages ещё недоступен.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-web
          path: hikari/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hikari/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: https://otshelniks.github.io/InterfaceForge/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
