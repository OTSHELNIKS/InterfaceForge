name: QA Hikari Web Screenshot
on:
  workflow_dispatch:
  push:
    branches: [arena/45285b5c-interfaceforge]
    paths:
      - '.github/workflows/qa-hikari-web.yml'
      - 'dev-preview/qa-website.cjs'
      - 'hikari/**'
permissions:
  contents: write
concurrency:
  group: hikari-qa
  cancel-in-progress: true
jobs:
  qa:
    name: Render and audit Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/hikari-qa/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Build web
        working-directory: hikari
        run: |
          flutter pub get
          flutter build web --release --base-href /InterfaceForge/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          mkdir -p /tmp/hikari-qa
          npm install --prefix /tmp/hikari-qa --no-audit --no-fund playwright sharp
          /tmp/hikari-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Audit pages and deep links
        run: |
          node dev-preview/serve-flutter-web.cjs hikari/build/web > /tmp/hikari-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/hikari-qa/server.log; exit 1; fi
          node dev-preview/qa-website.cjs
      - name: Publish QA artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f design/qa/website-*.jpg design/qa/website-report.json
          git diff --cached --quiet || git commit -m "QA: publish website audit"
          git push origin HEAD:refs/heads/arena/45285b5c-interfaceforge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikari-website-qa
          path: design/qa/website-*
          if-no-files-found: warn
          retention-days: 3
